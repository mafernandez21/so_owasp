# Filtro de ejemplo para fail2ban (/etc/fail2ban/filter.d/lab-login.conf).
# Reconoce las líneas que auth_server.py escribe en auth.log en modo seguro, por ejemplo:
#   2026-03-01 10:00:00 FALLO usuario=admin ip=192.168.0.10
[Definition]
failregex = ^\S+ \S+ FALLO usuario=\S* ip=<HOST>$
ignoreregex =
